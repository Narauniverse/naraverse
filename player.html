<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player — Naraverse</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--red:#e60000;--red-dim:#991100;--red-glow:rgba(230,0,0,0.15);--dark:#080808;--surface:#111;--surface2:#181818;--border:rgba(255,255,255,0.06);--border-red:rgba(230,0,0,0.22);--text:#e8e8e8;--muted:#666;--accent:#ff3333;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.4;}

    header{background:rgba(8,8,8,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-red);position:sticky;top:0;z-index:200;}
    .header-inner{max-width:1100px;margin:0 auto;padding:0 4%;height:60px;display:flex;align-items:center;gap:20px;}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:3px;color:#fff;text-decoration:none;}
    .logo span{color:var(--red);}
    .back-btn{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13.5px;text-decoration:none;margin-left:auto;transition:.2s;}
    .back-btn:hover{color:var(--text);}
    .back-btn svg{width:16px;height:16px;}

    /* AD TOP */
    .ad-banner{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:10px 4%;min-height:90px;position:relative;}
    .ad-banner::before{content:'ADVERTISEMENT';position:absolute;top:5px;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);opacity:.5;}
    .ad-banner.bottom{border-top:1px solid var(--border);border-bottom:none;margin-top:0;min-height:100px;}

    /* MAIN LAYOUT */
    .player-wrap{max-width:1100px;margin:0 auto;padding:28px 4%;}

    /* VIDEO */
    .video-box{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:100%;}
    #videoPlayer{width:100%;height:100%;display:block;}

    /* THUMB OVERLAY */
    #thumbOverlay{position:absolute;inset:0;z-index:30;cursor:pointer;}
    #thumbOverlay img{width:100%;height:100%;object-fit:cover;}
    #thumbOverlay .play-circle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);}
    #thumbOverlay .play-circle div{width:72px;height:72px;background:rgba(230,0,0,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
    #thumbOverlay:hover .play-circle div{transform:scale(1.1);}
    #thumbOverlay .play-circle svg{width:28px;height:28px;fill:#fff;margin-left:4px;}

    /* AD OVERLAY */
    #adOverlay{position:absolute;inset:0;background:rgba(0,0,0,0.93);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
    #adOverlay.show{display:flex;}
    .ad-overlay-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);}
    #adOverlaySlot{width:300px;height:250px;max-width:88vw;display:flex;align-items:center;justify-content:center;}
    .ad-skip-bar{width:300px;max-width:88vw;}
    .ad-skip-track{width:100%;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;}
    .ad-skip-fill{height:100%;background:var(--red);width:0%;transition:width .1s linear;}
    .ad-skip-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .ad-countdown{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
    .ad-skip-btn{height:34px;padding:0 16px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12.5px;cursor:pointer;transition:.2s;}
    .ad-skip-btn:not(:disabled):hover{border-color:var(--accent);color:var(--accent);}
    .ad-skip-btn:disabled{opacity:.4;cursor:not-allowed;}

    /* VIDEO INFO */
    .video-info{margin-top:20px;margin-bottom:24px;}
    .video-info h1{font-size:20px;font-weight:600;line-height:1.4;margin-bottom:10px;}
    .video-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
    .cat-pill{font-size:12px;color:var(--accent);background:rgba(230,0,0,0.1);border:1px solid rgba(230,0,0,0.2);padding:3px 10px;border-radius:4px;}
    .meta-tag{font-size:12px;font-family:'DM Mono',monospace;color:var(--muted);}
    .video-desc{font-size:14px;color:#aaa;line-height:1.75;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}

    /* VIDEO LIST (episodes) — di bawah video */
    .ep-section{margin-bottom:32px;}
    .ep-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .ep-section-header h3{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:2px;color:var(--muted);}
    .ep-section-header span{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
    .ep-grid{display:flex;flex-wrap:wrap;gap:8px;}
    .ep-btn{width:52px;height:52px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:1px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;position:relative;}
    .ep-btn:hover{border-color:var(--red-dim);background:var(--surface2);}
    .ep-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
    .ep-btn.active::after{content:'▶';position:absolute;bottom:3px;right:5px;font-size:7px;font-family:sans-serif;opacity:.8;}

    /* RELATED */
    .related-section{margin-top:8px;}
    .section-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:16px;}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
    .rel-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s;}
    .rel-card:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(0,0,0,0.5);}
    .rel-thumb{position:relative;padding-top:58%;overflow:hidden;}
    .rel-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s;}
    .rel-card:hover .rel-thumb img{transform:scale(1.06);}
    .rel-info{padding:11px;}
    .rel-info h4{font-size:13px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;}
    .rel-cat{font-size:11px;color:var(--accent);}

    .loader{display:flex;align-items:center;justify-content:center;padding:100px;}
    .spinner{width:38px;height:38px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    footer{border-top:1px solid var(--border-red);padding:28px 4%;text-align:center;}
    footer p{color:var(--muted);font-size:12.5px;margin-top:8px;}

    @media(max-width:640px){
      .ep-btn{width:44px;height:44px;font-size:1.2rem;}
    }
  </style>
</head>

<script>
  const WORKER = "https://naraverse.slibawblewer.workers.dev";

  const params = new URLSearchParams(location.search);
  const videoId = params.get('id');

  let videoData = null;
  let currentEp = 0;
  let viewCounted = false;

  async function init() {
    if (!videoId) { showError('ID video tidak ditemukan.'); return; }
    try {
      const res = await fetch(`${WORKER}/api/videos`);
      const all = await res.json();
      videoData = all.find(v => String(v.id) === String(videoId));
      if (!videoData) { showError('Video tidak ditemukan.'); return; }
      if (!videoData.episodes || !videoData.episodes.length) {
        videoData.episodes = [videoData.videoUrl].filter(Boolean);
      }
      const related = all.filter(v => String(v.id) !== String(videoId) && v.category === videoData.category).slice(0, 8);
      renderPlayer(related);
    } catch(e) {
      showError('Gagal memuat video.');
    }
  }

  function renderPlayer(related) {
    const v = videoData;
    const hasEps = v.episodes && v.episodes.length > 1;
    document.title = v.title + ' — Naraverse';

    document.getElementById('playerRoot').innerHTML = `
      <div class="video-box" id="videoBox">
        <div id="thumbOverlay">
          <img src="\( {esc(v.thumbnail)}" alt=" \){esc(v.title)}">
          <div class="play-circle">
            <div><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
        </div>
        <video id="videoPlayer" controls style="display:none;" preload="metadata">
          <source id="videoSource" src="" type="video/mp4">
        </video>
      </div>

      <div class="video-info">
        <h1>${esc(v.title)}</h1>
        <div class="video-meta">
          <span class="cat-pill">${esc(v.category||'Uncategorized')}</span>
          ${v.duration ? `<span class="meta-tag">⏱ ${esc(v.duration)}</span>` : ''}
          <span class="meta-tag" id="viewCount">👁 ${Number(v.views||0).toLocaleString()} views</span>
        </div>
        \( {v.description ? `<div class="video-desc"> \){esc(v.description)}</div>` : ''}
      </div>

      ${hasEps ? `
      <div class="ep-section">
        <div class="ep-section-header">
          <h3>VIDEO</h3>
          <span>${v.episodes.length} video</span>
        </div>
        <div class="ep-grid">
          ${v.episodes.map((url, i) => `
            <button class="ep-btn \( {i===0?'active':''}" id="ep- \){i}" onclick="playEpisode(${i})" title="Video \( {i+1}"> \){i+1}</button>
          `).join('')}
        </div>
      </div>` : ''}

      ${related.length ? `
      <div class="related-section">
        <div class="section-label">VIDEO TERKAIT</div>
        <div class="related-grid">
          ${related.map(r => `
            <div class="rel-card" onclick="location.href='player.html?id=${r.id}'">
              <div class="rel-thumb"><img src="\( {esc(r.thumbnail)}" alt=" \){esc(r.title)}" loading="lazy"></div>
              <div class="rel-info">
                <h4>${esc(r.title)}</h4>
                <div class="rel-cat">${esc(r.category||'')}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>` : ''}
    `;

    // pindahkan adOverlay masuk ke dalam video-box (biarin aja, ga dipake)
    const box = document.getElementById('videoBox');
    box.appendChild(document.getElementById('adOverlay'));

    document.getElementById('thumbOverlay').addEventListener('click', () => {
      window.open('https://omg10.com/4/10765433', '_blank');
      startPlay(0);
    });
  }

  function playEpisode(idx) {
    window.open('https://omg10.com/4/10765433', '_blank');
    startPlay(idx);
  }

  function startPlay(idx) {
    currentEp = idx;
    const url = videoData.episodes[idx];
    const player = document.getElementById('videoPlayer');
    const source = document.getElementById('videoSource');
    const overlay = document.getElementById('thumbOverlay');

    if (overlay) overlay.style.display = 'none';
    source.src = url;
    player.load();
    player.style.display = 'block';
    player.play().catch(()=>{});

    // update episode buttons
    document.querySelectorAll('.ep-btn').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });

    // increment view — hanya sekali per session
    if (!viewCounted) {
      viewCounted = true;
      fetch(`\( {WORKER}/api/videos/ \){videoId}/views`, { method: 'POST' }).catch(()=>{});
      const vc = document.getElementById('viewCount');
      if (vc) {
        const cur = videoData.views || 0;
        videoData.views = cur + 1;
        vc.textContent = `👁 ${Number(videoData.views).toLocaleString()} views`;
      }
    }
  }

  function showError(msg) {
    document.getElementById('playerRoot').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;padding:100px 20px;text-align:center;flex-direction:column;gap:16px;">
        <svg fill="none" stroke="#666" stroke-width="1.5" viewBox="0 0 24 24" width="56" height="56"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        <p style="color:var(--muted);font-size:16px;">${msg}</p>
        <a href="/" style="color:var(--accent);font-size:14px;">← Kembali ke Beranda</a>
      </div>`;
  }

  function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  init();
</script>
