<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="/image-1.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Naraverse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#e60000;--red-dim:#991100;--red-glow:rgba(230,0,0,0.18);--dark:#060608;--surface2:#181820;--border:rgba(255,255,255,0.06);--border-red:rgba(230,0,0,0.22);--text:#e8e8ee;--muted:#55556a;--accent:#ff3333;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.5;}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;}
.back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:20px;transition:.2s;width:fit-content;}
.back:hover{color:var(--accent);}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px;color:#fff;text-decoration:none;display:block;margin-bottom:24px;}
.logo span{color:var(--red);}
.avatar-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;}
.avatar{width:88px;height:88px;border-radius:50%;border:3px solid var(--red-dim);object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;}
.avatar img{width:100%;height:100%;object-fit:cover;display:none;}
.avatar svg{width:40px;height:40px;stroke:var(--muted);fill:none;}
.uname{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;margin-bottom:4px;}
.uemail{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
.card{background:#0e0e12;border:1px solid var(--border-red);border-radius:14px;padding:22px;margin-bottom:14px;}
.card h3{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.field input{width:100%;height:44px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:0 14px;outline:none;transition:.2s;}
.field input:focus{border-color:var(--red-dim);box-shadow:0 0 0 3px var(--red-glow);}
.field input::placeholder{color:var(--muted);}
.btn{width:100%;height:44px;background:var(--red);border:none;border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;}
.btn:hover{background:var(--accent);}
.btn-outline{width:100%;height:44px;background:transparent;border:1px solid var(--border-red);border-radius:8px;color:#ff4466;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:.2s;}
.btn-outline:hover{background:rgba(230,0,60,0.08);}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 20px;font-size:13px;color:var(--text);z-index:9000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(6,6,8,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border-red);z-index:600;}
.bottom-nav-inner{display:flex;align-items:stretch;height:100%;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;transition:.2s;padding:0;text-decoration:none;-webkit-tap-highlight-color:transparent;}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;}
.bn-item.active{color:var(--accent);}
.bn-item.active svg{stroke:var(--accent);}
.bn-item.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--red);border-radius:0 0 3px 3px;}
.bn-item{position:relative;}
@media(max-width:768px){.bottom-nav{display:block;}.wrap{padding-bottom:70px;}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <a href="/" class="back"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>Beranda</a>
  <a href="/" class="logo">NARA<span>VERSE</span></a>

  <div class="avatar-wrap">
    <div class="avatar" id="avatarBox">
      <img id="avatarImg" alt="">
      <svg id="avatarIcon" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
    </div>
    <div class="uname" id="uname">—</div>
    <div class="uemail" id="uemail">—</div>
  </div>

  <div class="card">
    <h3>EDIT PROFIL</h3>
    <div class="field"><label>NAMA TAMPILAN</label><input type="text" id="displayName" placeholder="Nama kamu"></div>
    <div class="field"><label>URL FOTO PROFIL</label><input type="url" id="avatarUrl" placeholder="https://..."></div>
    <button class="btn" onclick="saveProfile()">Simpan Perubahan</button>
  </div>

  <div class="card">
    <h3>AKUN</h3>
    <button class="btn-outline" onclick="doLogout()">Keluar dari Akun</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bn-item" href="/"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Beranda</span></a>
    <a class="bn-item" href="/cari.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span>Cari</span></a>
    <a class="bn-item" href="/watchlist.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/></svg><span>Watchlist</span></a>
    <a class="bn-item" href="/favorit.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg><span>Favorit</span></a>
    <a class="bn-item active" href="/profil.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg><span>Profil</span></a>
  </div>
</nav>

<script>
var WORKER='https://naraverse.slibawblewer.workers.dev';
function getToken(){return localStorage.getItem('nv_token')||'';}
function authH(){return{'Content-Type':'application/json','Authorization':'Bearer '+getToken()};}
var toastT;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2200);}

async function loadProfile(){
  if(!getToken()){window.location.href='/login.html';return;}
  try{
    var res=await fetch(WORKER+'/api/auth/me',{headers:authH()});
    if(!res.ok){window.location.href='/login.html';return;}
    var u=await res.json();
    document.getElementById('uname').textContent=u.display_name||u.username;
    document.getElementById('uemail').textContent=u.email;
    document.getElementById('displayName').value=u.display_name||u.username;
    document.getElementById('avatarUrl').value=u.avatar_url||'';
    if(u.avatar_url){
      document.getElementById('avatarImg').src=u.avatar_url;
      document.getElementById('avatarImg').style.display='block';
      document.getElementById('avatarIcon').style.display='none';
    }
  }catch(e){window.location.href='/login.html';}
}

async function saveProfile(){
  var dn=document.getElementById('displayName').value.trim();
  var av=document.getElementById('avatarUrl').value.trim();
  try{
    var res=await fetch(WORKER+'/api/auth/profile',{method:'PATCH',headers:authH(),body:JSON.stringify({display_name:dn,avatar_url:av})});
    if(res.ok){showToast('Profil diperbarui!');loadProfile();}
    else showToast('Gagal menyimpan.');
  }catch(e){showToast('Koneksi gagal.');}
}

function doLogout(){
  fetch(WORKER+'/api/auth/logout',{method:'POST',headers:authH()}).catch(function(){});
  localStorage.removeItem('nv_token');
  window.location.href='/';
}

loadProfile();

(function(){var cv=document.getElementById('bgCanvas');var ctx=cv.getContext('2d');var W,H,time=0;var particles=[];function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}window.addEventListener('resize',resize);resize();for(var i=0;i<50;i++)particles.push({x:Math.random(),y:Math.random(),z:Math.random()*900+100,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.6+.4,pulse:Math.random()*Math.PI*2});var orbs=[{x:.2,y:.3,r:260,s:.00025,ph:0,c:'200,0,0'},{x:.8,y:.7,r:220,s:.0003,ph:2,c:'120,0,0'}];function loop(){time++;ctx.fillStyle='#060608';ctx.fillRect(0,0,W,H);orbs.forEach(function(o){var ox=(o.x+Math.sin(time*o.s+o.ph)*.09)*W,oy=(o.y+Math.cos(time*o.s*.7+o.ph)*.07)*H;var g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);g.addColorStop(0,'rgba('+o.c+',0.07)');g.addColorStop(1,'rgba('+o.c+',0)');ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});var fov=500,cx=W/2,cy=H/2;particles.forEach(function(p){p.pulse+=.018;p.x+=p.vx/W;p.y+=p.vy/H;if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;var sc=fov/(fov+p.z);var px=cx+(p.x*W-cx)*sc,py=cy+(p.y*H-cy)*sc;var alpha=sc*(.4+.3*Math.sin(p.pulse));ctx.beginPath();ctx.arc(px,py,Math.max(.3,p.r*sc),0,Math.PI*2);ctx.fillStyle='rgba(255,60,60,'+Math.min(alpha,.65)+')';ctx.fill();});requestAnimationFrame(loop);}loop();})();
</script>
</body>
</html>
