<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="/image-1.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Naraverse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#e60000;--red-dim:#991100;--red-glow:rgba(230,0,0,0.18);--dark:#060608;--surface2:#181820;--border:rgba(255,255,255,0.06);--border-red:rgba(230,0,0,0.22);--text:#e8e8ee;--muted:#55556a;--accent:#ff3333;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.5;}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;width:100%;max-width:400px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:#fff;text-decoration:none;display:block;text-align:center;margin-bottom:28px;}
.logo span{color:var(--red);}
.logo sup{font-family:'DM Mono',monospace;font-size:9px;color:var(--red);border:1px solid var(--red);border-radius:3px;padding:1px 4px;vertical-align:super;margin-left:3px;}
.card{background:#0e0e12;border:1px solid var(--border-red);border-radius:16px;overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;height:46px;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:.2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--red);}
.body{padding:24px;}
.form{display:none;}
.form.active{display:block;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.field input{width:100%;height:44px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:0 14px;outline:none;transition:.2s;}
.field input:focus{border-color:var(--red-dim);box-shadow:0 0 0 3px var(--red-glow);}
.field input::placeholder{color:var(--muted);}
.btn{width:100%;height:46px;background:var(--red);border:none;border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px;}
.btn:hover{background:var(--accent);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.err{color:#ff4466;font-size:12px;margin-top:10px;min-height:18px;font-family:'DM Mono',monospace;}
.back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:20px;transition:.2s;width:fit-content;}
.back:hover{color:var(--accent);}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <a href="/" class="back"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>Kembali ke Beranda</a>
  <a href="/" class="logo">NARA<span>VERSE</span><sup>18+</sup></a>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
      <button class="tab" id="tabRegister" onclick="switchTab('register')">Daftar</button>
    </div>
    <div class="body">
      <!-- LOGIN -->
      <div class="form active" id="formLogin">
        <div class="field"><label>EMAIL ATAU USERNAME</label><input type="text" id="loginId" placeholder="email atau username" autocomplete="username"></div>
        <div class="field"><label>PASSWORD</label><input type="password" id="loginPw" placeholder="Password kamu" autocomplete="current-password"></div>
        <button class="btn" id="loginBtn" onclick="doLogin()">Masuk</button>
        <div class="err" id="loginErr"></div>
      </div>
      <!-- REGISTER -->
      <div class="form" id="formRegister">
        <div class="field"><label>EMAIL</label><input type="email" id="regEmail" placeholder="email@kamu.com" autocomplete="email"></div>
        <div class="field"><label>USERNAME</label><input type="text" id="regUsername" placeholder="username" autocomplete="username"></div>
        <div class="field"><label>PASSWORD</label><input type="password" id="regPw" placeholder="Minimal 8 karakter" autocomplete="new-password"></div>
        <button class="btn" id="registerBtn" onclick="doRegister()">Buat Akun</button>
        <div class="err" id="registerErr"></div>
      </div>
    </div>
  </div>
</div>
<script>
var WORKER='https://naraverse.slibawblewer.workers.dev';
function getToken(){return localStorage.getItem('nv_token')||'';}
function switchTab(tab){
  document.getElementById('formLogin').classList.toggle('active',tab==='login');
  document.getElementById('formRegister').classList.toggle('active',tab==='register');
  document.getElementById('tabLogin').classList.toggle('active',tab==='login');
  document.getElementById('tabRegister').classList.toggle('active',tab==='register');
  document.getElementById('loginErr').textContent='';
  document.getElementById('registerErr').textContent='';
}
async function doLogin(){
  var id=document.getElementById('loginId').value.trim();
  var pw=document.getElementById('loginPw').value;
  if(!id||!pw){document.getElementById('loginErr').textContent='Semua field wajib diisi.';return;}
  var btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Memproses...';
  try{
    var res=await fetch(WORKER+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:id,password:pw})});
    var d=await res.json();
    if(!res.ok){document.getElementById('loginErr').textContent=d.error||'Login gagal.';}
    else{localStorage.setItem('nv_token',d.token);window.location.href='/';}
  }catch(e){document.getElementById('loginErr').textContent='Koneksi gagal.';}
  btn.disabled=false;btn.textContent='Masuk';
}
async function doRegister(){
  var email=document.getElementById('regEmail').value.trim();
  var uname=document.getElementById('regUsername').value.trim();
  var pw=document.getElementById('regPw').value;
  if(!email||!uname||!pw){document.getElementById('registerErr').textContent='Semua field wajib diisi.';return;}
  if(pw.length<8){document.getElementById('registerErr').textContent='Password minimal 8 karakter.';return;}
  if(!/^[a-zA-Z0-9_]+$/.test(uname)){document.getElementById('registerErr').textContent='Username hanya huruf, angka, underscore.';return;}
  var btn=document.getElementById('registerBtn');btn.disabled=true;btn.textContent='Memproses...';
  try{
    var res=await fetch(WORKER+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,username:uname,password:pw})});
    var d=await res.json();
    if(!res.ok){document.getElementById('registerErr').textContent=d.error||'Pendaftaran gagal.';}
    else{localStorage.setItem('nv_token',d.token);window.location.href='/';}
  }catch(e){document.getElementById('registerErr').textContent='Koneksi gagal.';}
  btn.disabled=false;btn.textContent='Buat Akun';
}
// Kalau udah login, redirect ke home
if(getToken()){
  fetch(WORKER+'/api/auth/me',{headers:{'Authorization':'Bearer '+getToken()}}).then(function(r){if(r.ok)window.location.href='/';});
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(document.getElementById('formLogin').classList.contains('active'))doLogin();
  else doRegister();
});
// BG
(function(){var cv=document.getElementById('bgCanvas');var ctx=cv.getContext('2d');var W,H,time=0;var particles=[];function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}window.addEventListener('resize',resize);resize();for(var i=0;i<50;i++)particles.push({x:Math.random(),y:Math.random(),z:Math.random()*900+100,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.6+.4,pulse:Math.random()*Math.PI*2});var orbs=[{x:.2,y:.3,r:260,s:.00025,ph:0,c:'200,0,0'},{x:.8,y:.7,r:220,s:.0003,ph:2,c:'120,0,0'}];function loop(){time++;ctx.fillStyle='#060608';ctx.fillRect(0,0,W,H);orbs.forEach(function(o){var ox=(o.x+Math.sin(time*o.s+o.ph)*.09)*W,oy=(o.y+Math.cos(time*o.s*.7+o.ph)*.07)*H;var g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);g.addColorStop(0,'rgba('+o.c+',0.07)');g.addColorStop(1,'rgba('+o.c+',0)');ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});var fov=500,cx=W/2,cy=H/2;particles.forEach(function(p){p.pulse+=.018;p.x+=p.vx/W;p.y+=p.vy/H;if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;var sc=fov/(fov+p.z);var px=cx+(p.x*W-cx)*sc,py=cy+(p.y*H-cy)*sc;var alpha=sc*(.4+.3*Math.sin(p.pulse));ctx.beginPath();ctx.arc(px,py,Math.max(.3,p.r*sc),0,Math.PI*2);ctx.fillStyle='rgba(255,60,60,'+Math.min(alpha,.65)+')';ctx.fill();});requestAnimationFrame(loop);}loop();})();
</script>
</body>
</html>
