<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --primary: #25D366;
            --accent: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0a1f 0%, #1a0f2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(37, 211, 102, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 420px;
            width: 90%;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .profile {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(37, 211, 102, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(3deg);
            border-color: var(--primary);
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 20px;
            background: linear-gradient(90deg, #e0b2ff, #f0c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #d8b4fe;
            font-size: 1.05rem;
            margin-top: 8px;
            opacity: 0.9;
        }

        .bio {
            margin: 25px auto;
            max-width: 300px;
            color: #c4b5fd;
            line-height: 1.5;
            font-size: 1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 18px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.6s;
        }

        .link-btn:hover {
            transform: translateY(-4px);
            background: rgba(37, 211, 102, 0.25);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.25);
        }

        .link-btn:hover::before {
            left: 150%;
        }

        .link-btn svg {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            opacity: 0.6;
        }

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(37,211,102,0.25) 0%, transparent 70%);
            filter: blur(60px);
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

            btn.style.opacity = '0';
            btn.style.transform = 'translateY(30px)';
            setTimeout(() => {
                btn.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                btn.style.transitionDelay = (index * 80) + 'ms';
                btn.style.opacity = '1';
                btn.style.transform = 'translateY(0)';
            }, 300);
        });
