  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naraverse — Premium Entertainment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:#e60000; --red-dim:#991100; --red-glow:rgba(230,0,0,0.18);
      --dark:#060608; --surface:rgba(14,14,18,0.96); --surface2:#181820;
      --border:rgba(255,255,255,0.06); --border-red:rgba(230,0,0,0.22);
      --text:#e8e8ee; --muted:#55556a; --accent:#ff3333;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}

    /* GRAIN */
    body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.5;}

    /* 3D BG */
    #bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
    .page-wrap{position:relative;z-index:1;}

    /* HEADER */
    header{position:sticky;top:0;z-index:500;background:rgba(6,6,8,0.9);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border-red);}
    .header-inner{max-width:1400px;margin:0 auto;padding:0 4%;height:62px;display:flex;align-items:center;gap:18px;}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:3px;color:#fff;text-decoration:none;flex-shrink:0;position:relative;}
    .logo span{color:var(--red);}
    .logo::after{content:'18+';position:absolute;top:-2px;right:-34px;font-family:'DM Mono',monospace;font-size:9px;color:var(--red);border:1px solid var(--red);border-radius:3px;padding:1px 4px;line-height:1.4;}

    .search-bar{flex:1;max-width:440px;position:relative;}
    .search-bar input{width:100%;height:40px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:0 40px 0 16px;outline:none;transition:border-color .2s,box-shadow .2s;}
    .search-bar input::placeholder{color:var(--muted);}
    .search-bar input:focus{border-color:var(--red-dim);box-shadow:0 0 0 3px var(--red-glow);}
    .search-bar svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);pointer-events:none;}
    #searchResults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#0e0e12;border:1px solid var(--border-red);border-radius:10px;overflow:hidden;display:none;box-shadow:0 24px 60px rgba(0,0,0,0.8);z-index:600;}
    .sri{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;}
    .sri:last-child{border-bottom:none;}
    .sri:hover{background:var(--surface2);}
    .sri img{width:52px;height:38px;object-fit:cover;border-radius:5px;flex-shrink:0;}
    .sri-title{font-size:13.5px;font-weight:500;line-height:1.3;}
    .sri-cat{font-size:11px;color:var(--red);margin-top:3px;}
    .sri-empty{padding:18px 14px;color:var(--muted);font-size:14px;}

    .nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .nav-btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;}
    .nav-btn:hover{border-color:var(--red-dim);color:var(--accent);}
    .nav-btn svg{width:16px;height:16px;}
    .hamburger{display:none;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);border-radius:8px;flex-direction:column;gap:5px;}
    .hamburger span{width:18px;height:1.5px;background:var(--text);border-radius:2px;transition:all .3s;}

    /* ── AD BANNER — 2 SLOT SIDE BY SIDE ── */
    .ad-top-wrap{max-width:1400px;margin:0 auto;padding:14px 4%;}
    .ad-top-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);opacity:.5;text-align:center;margin-bottom:8px;}
    .ad-top-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .ad-slot{background:rgba(14,14,18,0.85);border:1px solid var(--border);border-radius:8px;height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;} .ad-slot>div{width:250px!important;height:100px!important;overflow:hidden;flex-shrink:0;}

    /* FILTER */
    .filter-bar{max-width:1400px;margin:0 auto;padding:0 4%;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
    .filter-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:1px;margin-right:4px;}
    .filter-chip{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12.5px;cursor:pointer;transition:all .2s;white-space:nowrap;}
    .filter-chip:hover,.filter-chip.active{border-color:var(--red);color:var(--accent);background:rgba(230,0,0,0.07);}
    .sort-select{margin-left:auto;height:34px;padding:0 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;outline:none;}

    /* STATS */
    .stats-bar{max-width:1400px;margin:0 auto;padding:12px 4% 0;display:flex;align-items:center;justify-content:space-between;}
    .stats-text{font-size:11.5px;color:var(--muted);font-family:'DM Mono',monospace;}
    .stats-text span{color:var(--accent);}

    /* ── VIDEO GRID — YouTube style, 6 col ── */
    .grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 4% 32px;}

    .card{background:transparent;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .3s cubic-bezier(.22,1,.36,1);border:none;}
    .card:hover{transform:translateY(-4px);}

    .thumb-wrap{position:relative;padding-top:58%;overflow:hidden;background:#0a0a0e;border-radius:8px;}
    .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.22,1,.36,1);}
    .card:hover img{transform:scale(1.07);}

    .duration{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.86);color:#fff;font-family:'DM Mono',monospace;font-size:10px;padding:2px 5px;border-radius:4px;}
    .badge-new{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:4px;}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background .3s;border-radius:8px;}
    .card:hover .play-overlay{background:rgba(0,0,0,0.35);}
    .play-icon{width:40px;height:40px;background:rgba(230,0,0,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.7);transition:opacity .3s,transform .3s cubic-bezier(.22,1,.36,1);}
    .card:hover .play-icon{opacity:1;transform:scale(1);}
    .play-icon svg{width:17px;height:17px;fill:#fff;margin-left:3px;}

    .card-info{padding:9px 2px 0;}
    .card-info h3{font-size:13px;font-weight:500;line-height:1.4;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;}
    .card-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;}
    .cat-tag{font-size:10px;font-weight:500;color:var(--accent);background:rgba(230,0,0,0.1);border:1px solid rgba(230,0,0,0.2);padding:2px 7px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;}
    .view-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap;}

    /* SKELETON */
    .skeleton{border-radius:10px;overflow:hidden;}
    .skeleton-thumb{padding-top:58%;background:linear-gradient(90deg,#111116 25%,#1a1a22 50%,#111116 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
    .skeleton-info{padding:9px 2px 0;}
    .skeleton-line{height:11px;border-radius:4px;margin-bottom:8px;background:linear-gradient(90deg,#111116 25%,#1a1a22 50%,#111116 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
    .skeleton-line.short{width:55%;}
    @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

    /* PAGINATION */
    .pagination{display:flex;justify-content:center;gap:6px;padding:4px 4% 32px;}
    .page-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;}
    .page-btn:hover{border-color:var(--red-dim);color:var(--accent);}
    .page-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
    .page-btn:disabled{opacity:.3;cursor:not-allowed;}

    /* AD BOTTOM — same 2 slot */
    .ad-bottom-wrap{max-width:1400px;margin:0 auto;padding:0 4% 20px;}

    /* FOOTER */
    footer{border-top:1px solid var(--border-red);padding:44px 4% 32px;}
    .footer-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;}
    .footer-brand .logo{font-size:1.6rem;display:block;margin-bottom:12px;}
    .footer-brand p{font-size:13px;color:var(--muted);line-height:1.75;max-width:240px;}
    .footer-bottom{max-width:1400px;margin:28px auto 0;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .footer-bottom p{font-size:12px;color:var(--muted);}
    .footer-badges{display:flex;align-items:center;gap:8px;}
    .badge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted);}

    /* DRAWER */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:800;display:none;opacity:0;transition:opacity .3s;}
    .drawer-overlay.open{display:block;opacity:1;}
    .drawer{position:fixed;top:0;right:0;width:280px;height:100%;background:#0e0e12;border-left:1px solid var(--border-red);z-index:900;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding:24px;display:flex;flex-direction:column;gap:20px;}
    .drawer.open{transform:translateX(0);}
    .drawer-close{align-self:flex-end;width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
    .drawer a{font-size:15px;color:var(--text);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:color .2s;}
    .drawer a:hover{color:var(--accent);}
    .drawer a svg{width:16px;height:16px;stroke:currentColor;}

    /* EMPTY */
    .empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted);}
    .empty-state svg{width:56px;height:56px;margin-bottom:18px;opacity:.25;}
    .empty-state p{font-size:15px;}

    /* BACK TO TOP */
    #backToTop{position:fixed;bottom:26px;right:26px;width:42px;height:42px;background:var(--red);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;z-index:400;}
    #backToTop.show{opacity:1;transform:translateY(0);}
    #backToTop svg{width:20px;height:20px;stroke:#fff;}

    /* RESPONSIVE */
    @media(max-width:1200px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:960px){
      .grid{grid-template-columns:repeat(2,1fr);}
      .nav-right .nav-btn{display:none;}
      .hamburger{display:flex;}
      
    }
    @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:520px){
      .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
      .ad-top-grid{grid-template-columns:1fr;}
      
      .logo::after{display:none;}
      .card-info h3{font-size:12px;}
    }
  </style>
</head>

/* ══════════════════════════════════════
   3D BACKGROUND
   ══════════════════════════════════════ */
(function() {
  var cv = document.getElementById('bgCanvas');
  var ctx = cv.getContext('2d');
  var W, H, cx, cy, time = 0;
  var particles = [];
  var mouse = {x:0,y:0};

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    cx = W/2; cy = H/2;
  }
  window.addEventListener('resize', resize);
  resize();
  window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});

  for (var i=0;i<70;i++) {
    particles.push({x:Math.random()*1,y:Math.random()*1,z:Math.random()*900+100,
      vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
      r:Math.random()*1.6+.4,pulse:Math.random()*Math.PI*2});
  }

  var orbs=[
    {x:.2,y:.3,r:260,s:.00025,ph:0,c:'200,0,0'},
    {x:.8,y:.7,r:220,s:.0003,ph:2,c:'120,0,0'},
    {x:.5,y:.15,r:180,s:.00035,ph:4,c:'160,0,0'},
    {x:.3,y:.8,r:200,s:.0002,ph:1,c:'80,0,0'}
  ];

  function p3d(x,y,z,panR,tiltR){
    var cP=Math.cos(panR),sP=Math.sin(panR);
    var rx=x*cP-z*sP, rz=x*sP+z*cP;
    var cT=Math.cos(tiltR),sT=Math.sin(tiltR);
    var ry=y*cT-rz*sT, rz2=y*sT+rz*cT;
    var fov=600, d=fov+rz2;
    if(d<=0)return{x:cx,y:cy};
    var sc=fov/d;
    return{x:cx+rx*sc,y:cy+ry*sc};
  }

  function drawGrid(){
    var pan=(mouse.x/W-.5)*.28, tilt=(mouse.y/H-.5)*.22;
    var R=16,C=16,sp=85,zD=700;
    for(var r=0;r<=R;r++){
      var py=(-(R/2)*sp)+r*sp;
      var a=0.025+0.035*Math.abs(Math.sin(time*.35+r*.28));
      var p1=p3d(-(C/2)*sp,py,0,pan,tilt), p2=p3d((C/2)*sp,py,0,pan,tilt);
      var p3=p3d(-(C/2)*sp,py,zD,pan,tilt), p4=p3d((C/2)*sp,py,zD,pan,tilt);
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p3.x,p3.y);
      ctx.strokeStyle='rgba(200,0,0,'+a+')';ctx.lineWidth=.55;ctx.stroke();
      ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p4.x,p4.y);
      ctx.strokeStyle='rgba(200,0,0,'+a+')';ctx.stroke();
    }
    for(var c=0;c<=C;c++){
      var px=(-(C/2)*sp)+c*sp;
      var a2=0.025+0.035*Math.abs(Math.sin(time*.35+c*.28));
      var q1=p3d(px,-(R/2)*sp,0,pan,tilt),q2=p3d(px,(R/2)*sp,0,pan,tilt);
      var q3=p3d(px,-(R/2)*sp,zD,pan,tilt),q4=p3d(px,(R/2)*sp,zD,pan,tilt);
      ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q3.x,q3.y);
      ctx.strokeStyle='rgba(200,0,0,'+a2+')';ctx.lineWidth=.55;ctx.stroke();
      ctx.beginPath();ctx.moveTo(q2.x,q2.y);ctx.lineTo(q4.x,q4.y);
      ctx.strokeStyle='rgba(200,0,0,'+a2+')';ctx.stroke();
    }
  }

  function drawOrbs(){
    orbs.forEach(function(o){
      var ox=(o.x+Math.sin(time*o.s+o.ph)*.09)*W;
      var oy=(o.y+Math.cos(time*o.s*.7+o.ph)*.07)*H;
      var g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);
      g.addColorStop(0,'rgba('+o.c+',0.07)');
      g.addColorStop(1,'rgba('+o.c+',0)');
      ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
  }

  function drawParticles(){
    var fov=500;
    particles.forEach(function(p){
      p.pulse+=.018;
      p.x+=p.vx/W; p.y+=p.vy/H;
      if(p.x<0)p.x=1; if(p.x>1)p.x=0;
      if(p.y<0)p.y=1; if(p.y>1)p.y=0;
      var sc=fov/(fov+p.z);
      var px=cx+(p.x*W-cx)*sc, py=cy+(p.y*H-cy)*sc;
      var alpha=sc*(.4+.3*Math.sin(p.pulse));
      var r=p.r*sc;
      ctx.beginPath();ctx.arc(px,py,Math.max(.3,r),0,Math.PI*2);
      ctx.fillStyle='rgba(255,60,60,'+Math.min(alpha,.65)+')';
      ctx.fill();
    });
  }

  function loop(){
    time++;
    ctx.fillStyle='#060608';
    ctx.fillRect(0,0,W,H);
    drawOrbs();
    drawGrid();
    drawParticles();
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ══════════════════════════════════════
   APP
   ══════════════════════════════════════ */
var WORKER_URL = "https://naraverse.slibawblewer.workers.dev";
var PER_PAGE = 20;
var allVideos=[], filteredVideos=[], currentPage=1, activeCategory='all';
var favorites = JSON.parse(localStorage.getItem('nv_favorites')||'[]');

async function loadVideos(){
  renderSkeletons();
  try{
    var res = await fetch(WORKER_URL+'/api/videos');
    allVideos = await res.json();
    allVideos = allVideos.map(function(v){
      return Object.assign({},v,{
        views: v.views||Math.floor(Math.random()*48000)+1200,
        duration: v.duration||rndDur(),
        isNew: v.isNew!==undefined?v.isNew:Math.random()>.75
      });
    });
    buildChips();
    applyFilter('all');
  } catch(e){
    document.getElementById('videoGrid').innerHTML='<div class="empty-state"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg><p>Gagal memuat video.</p></div>';
  }
}

function rndDur(){var m=Math.floor(Math.random()*45)+3,s=Math.floor(Math.random()*60);return m+':'+(s<10?'0':'')+s;}

function renderSkeletons(){
  var html='';
  for(var i=0;i<12;i++) html+='<div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>';
  document.getElementById('videoGrid').innerHTML=html;
}

function buildChips(){
  var cats=[];
  allVideos.forEach(function(v){if(v.category&&cats.indexOf(v.category)===-1)cats.push(v.category);});
  var bar=document.getElementById('filterBar');
  cats.forEach(function(cat){
    var b=document.createElement('button');
    b.className='filter-chip'; b.dataset.cat=cat; b.textContent=cat;
    b.onclick=function(){applyFilter(cat);};
    bar.appendChild(b);
  });
}

function applyFilter(cat){
  activeCategory=cat;
  document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.toggle('active',c.dataset.cat===cat);});
  applySortFilter();
}

function applySortFilter(){
  var sort=document.getElementById('sortSelect').value;
  var base=activeCategory==='all'?allVideos.slice():allVideos.filter(function(v){return v.category===activeCategory;});
  if(sort==='popular') base.sort(function(a,b){return b.views-a.views;});
  else if(sort==='az') base.sort(function(a,b){return(a.title||'').localeCompare(b.title||'');});
  filteredVideos=base;
  document.getElementById('statsCount').textContent=filteredVideos.length.toLocaleString();
  renderPage(1);
}

function renderPage(page){
  currentPage=page;
  var grid=document.getElementById('videoGrid');
  var start=(page-1)*PER_PAGE;
  var slice=filteredVideos.slice(start,start+PER_PAGE);
  if(!slice.length){
    grid.innerHTML='<div class="empty-state"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><p>Tidak ada video.</p></div>';
    document.getElementById('pagination').innerHTML='';
    return;
  }
  grid.innerHTML='';
  slice.forEach(function(v,i){
    var card=document.createElement('div');
    card.className='card';
    card.style.cssText='opacity:0;transform:translateY(16px);';
    card.innerHTML=
      '<div class="thumb-wrap">'
        +'<img src="'+v.thumbnail+'" alt="'+esc(v.title)+'" loading="lazy" oncontextmenu="return false;" draggable="false">'
        +'<div class="play-overlay"><div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>'
        +(v.isNew?'<span class="badge-new">NEW</span>':'')
        +'<span class="duration">'+(v.duration||'—')+'</span>'
      +'</div>'
      +'<div class="card-info">'
        +'<h3>'+esc(v.title)+'</h3>'
        +'<div class="card-meta">'
          +'<span class="cat-tag">'+esc(v.category||'Uncategorized')+'</span>'
          +'<span class="view-count">'+Number(v.views).toLocaleString()+' views</span>'
        +'</div>'
      +'</div>';
    card.onclick=function(){
      card.style.opacity='.7';card.style.transform='scale(.97)';
      setTimeout(function(){window.open('player.html?id='+v.id,'_blank');},150);
    };
    grid.appendChild(card);
    setTimeout(function(){
      card.style.transition='opacity .38s ease,transform .38s ease';
      card.style.opacity='1';card.style.transform='translateY(0)';
    },i*35);
  });
  renderPagination();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderPagination(){
  var total=Math.ceil(filteredVideos.length/PER_PAGE);
  var pg=document.getElementById('pagination');
  if(total<=1){pg.innerHTML='';return;}
  var html='<button class="page-btn"'+(currentPage===1?' disabled':'')+' onclick="renderPage('+(currentPage-1)+')">'
    +'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>';
  pageRange(currentPage,total).forEach(function(p){
    html+=p==='…'
      ?'<button class="page-btn" disabled>…</button>'
      :'<button class="page-btn'+(p===currentPage?' active':'')+'" onclick="renderPage('+p+')">'+p+'</button>';
  });
  html+='<button class="page-btn"'+(currentPage===total?' disabled':'')+' onclick="renderPage('+(currentPage+1)+')">'
    +'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>';
  pg.innerHTML=html;
}

function pageRange(cur,total){
  if(total<=7){var a=[];for(var i=1;i<=total;i++)a.push(i);return a;}
  if(cur<=4)return[1,2,3,4,5,'…',total];
  if(cur>=total-3)return[1,'…',total-4,total-3,total-2,total-1,total];
  return[1,'…',cur-1,cur,cur+1,'…',total];
}

// SEARCH
var si=document.getElementById('searchInput');
var sr=document.getElementById('searchResults');
var st;
si.addEventListener('input',function(){
  clearTimeout(st);
  var q=si.value.trim().toLowerCase();
  if(!q){sr.style.display='none';return;}
  st=setTimeout(function(){
    var hits=allVideos.filter(function(v){return(v.title||'').toLowerCase().includes(q)||(v.category||'').toLowerCase().includes(q);}).slice(0,6);
    sr.innerHTML=hits.length
      ?hits.map(function(v){return'<div class="sri" onclick="window.open(\'player.html?id='+v.id+'\',\'_blank\')">'
        +'<img src="'+v.thumbnail+'" alt="">'
        +'<div><div class="sri-title">'+esc(v.title)+'</div><div class="sri-cat">'+esc(v.category||'')+'</div></div></div>';}).join('')
      :'<div class="sri-empty">Tidak ditemukan hasil.</div>';
    sr.style.display='block';
  },200);
});
document.addEventListener('click',function(e){if(!e.target.closest('.search-bar'))sr.style.display='none';});

function openCategories(){
  var cats=[];
  allVideos.forEach(function(v){if(v.category&&cats.indexOf(v.category)===-1)cats.push(v.category);});
  showModal('Kategori',cats.map(function(c){
    return'<div style="padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px;color:var(--text);" onclick="closeModal();applyFilter(\''+esc(c)+'\')">'+esc(c)+'</div>';
  }).join('')||'<p style="color:var(--muted)">Belum ada kategori.</p>');
}

function openFavorites(){
  var fv=allVideos.filter(function(v){return favorites.indexOf(String(v.id))!==-1;});
  showModal('Favorit',fv.length?fv.map(function(v){
    return'<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="window.open(\'player.html?id='+v.id+'\',\'_blank\')">'
      +'<img src="'+v.thumbnail+'" style="width:72px;height:50px;object-fit:cover;border-radius:6px;flex-shrink:0;">'
      +'<div><div style="font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px;">'+esc(v.title)+'</div><div style="font-size:12px;color:var(--red);">'+esc(v.category||'')+'</div></div></div>';
  }).join(''):'<p style="color:var(--muted);font-size:14px;">Belum ada favorit.</p>');
}

function showModal(title,content){
  var m=document.getElementById('nvModal');
  if(!m){m=document.createElement('div');m.id='nvModal';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';m.onclick=function(e){if(e.target===m)closeModal();};document.body.appendChild(m);}
  m.innerHTML='<div style="background:#0e0e12;border:1px solid var(--border-red);border-radius:14px;width:100%;max-width:440px;max-height:80vh;overflow-y:auto;padding:28px;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'
    +'<h2 style="font-family:\'Bebas Neue\',sans-serif;font-size:1.6rem;letter-spacing:2px;">'+title+'</h2>'
    +'<button onclick="closeModal()" style="background:transparent;border:1px solid var(--border);width:34px;height:34px;border-radius:8px;color:var(--text);cursor:pointer;font-size:16px;">✕</button>'
    +'</div>'+content+'</div>';
  m.style.display='flex';
}
function closeModal(){var m=document.getElementById('nvModal');if(m)m.style.display='none';}
function toggleDrawer(open){document.getElementById('mobileDrawer').classList.toggle('open',open);document.getElementById('drawerOverlay').classList.toggle('open',open);}
window.addEventListener('scroll',function(){document.getElementById('backToTop').classList.toggle('show',window.scrollY>400);});
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

loadVideos();
</script>
