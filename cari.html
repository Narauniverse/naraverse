<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="/image-1.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari — Naraverse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#e60000;--red-dim:#991100;--red-glow:rgba(230,0,0,0.18);--dark:#060608;--surface2:#181820;--border:rgba(255,255,255,0.06);--border-red:rgba(230,0,0,0.22);--text:#e8e8ee;--muted:#55556a;--accent:#ff3333;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.5;}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;}
.back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:20px;transition:.2s;width:fit-content;}
.back:hover{color:var(--accent);}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px;color:#fff;text-decoration:none;display:block;margin-bottom:20px;}
.logo span{color:var(--red);}
.search-wrap{position:relative;margin-bottom:24px;}
.search-wrap input{width:100%;height:50px;background:rgba(255,255,255,0.04);border:1px solid var(--border-red);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;padding:0 50px 0 18px;outline:none;transition:.2s;}
.search-wrap input:focus{border-color:var(--red-dim);box-shadow:0 0 0 3px var(--red-glow);}
.search-wrap input::placeholder{color:var(--muted);}
.search-wrap svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;}
.stats{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);margin-bottom:16px;}
.stats b{color:var(--accent);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.card{border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .3s cubic-bezier(.22,1,.36,1);}
.card:hover{transform:translateY(-4px);}
.thumb-wrap{position:relative;padding-top:58%;overflow:hidden;background:#0a0a0e;border-radius:8px;}
.thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s,opacity .3s;opacity:0;}
.thumb-wrap img.loaded{opacity:1;}
.card:hover .thumb-wrap img{transform:scale(1.06);}
.play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background .3s;}
.card:hover .play-overlay{background:rgba(0,0,0,0.35);}
.play-icon{width:40px;height:40px;background:rgba(230,0,0,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.7);transition:opacity .3s,transform .3s;}
.card:hover .play-icon{opacity:1;transform:scale(1);}
.play-icon svg{width:17px;height:17px;fill:#fff;margin-left:3px;}
.dur-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.86);color:#fff;font-family:'DM Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;}
.card-info{padding:9px 2px 0;}
.card-info h3{font-size:13px;font-weight:500;line-height:1.4;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.cat-tag{font-size:10px;color:var(--accent);background:rgba(230,0,0,0.1);border:1px solid rgba(230,0,0,0.2);padding:2px 7px;border-radius:3px;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty svg{width:48px;height:48px;margin:0 auto 16px;display:block;opacity:.2;stroke:var(--muted);fill:none;}
/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(6,6,8,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border-red);z-index:600;}
.bottom-nav-inner{display:flex;align-items:stretch;height:100%;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;transition:.2s;padding:0;text-decoration:none;position:relative;-webkit-tap-highlight-color:transparent;}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;}
.bn-item.active{color:var(--accent);}
.bn-item.active svg{stroke:var(--accent);}
.bn-item.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--red);border-radius:0 0 3px 3px;}
@media(max-width:768px){.bottom-nav{display:block;}.wrap{padding-bottom:70px;}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <a href="/" class="back"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>Beranda</a>
  <a href="/" class="logo">NARA<span>VERSE</span></a>
  <div class="search-wrap">
    <input type="text" id="q" placeholder="Cari video, kategori..." autocomplete="off" autofocus>
    <svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
  </div>
  <div class="stats" id="stats" style="display:none;">Ditemukan <b id="statsNum">0</b> video</div>
  <div class="grid" id="grid"></div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bn-item" href="/"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Beranda</span></a>
    <a class="bn-item active" href="/cari.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span>Cari</span></a>
    <a class="bn-item" href="/watchlist.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/></svg><span>Watchlist</span></a>
    <a class="bn-item" href="/favorit.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg><span>Favorit</span></a>
    <a class="bn-item" href="/profil.html"><svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg><span>Profil</span></a>
  </div>
</nav>

<script>
var WORKER='https://naraverse.slibawblewer.workers.dev';
var allVideos=[];
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function loadAll(){
  try{
    var res=await fetch(WORKER+'/api/videos');
    allVideos=await res.json();
    if(!Array.isArray(allVideos))allVideos=[];
  }catch(e){}
}

function render(videos){
  var grid=document.getElementById('grid');
  if(!videos.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><p>Tidak ada hasil.</p></div>';return;}
  document.getElementById('stats').style.display='block';
  document.getElementById('statsNum').textContent=videos.length;
  grid.innerHTML=videos.map(function(v){
    return'<div class="card" onclick="window.open(\'player.html?id='+v.id+'\',\'_blank\')">'
      +'<div class="thumb-wrap"><img src="'+esc(v.thumbnail)+'" alt="'+esc(v.title)+'" onload="this.classList.add(\'loaded\')" loading="lazy">'
      +'<div class="play-overlay"><div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>'
      +'<span class="dur-badge">'+esc(v.duration||'')+'</span></div>'
      +'<div class="card-info"><h3>'+esc(v.title)+'</h3>'
      +'<div class="card-meta"><span class="cat-tag">'+esc(v.category||'')+'</span></div></div></div>';
  }).join('');
}

var st;
document.getElementById('q').addEventListener('input',function(){
  clearTimeout(st);
  var q=this.value.trim().toLowerCase();
  if(!q){document.getElementById('grid').innerHTML='';document.getElementById('stats').style.display='none';return;}
  st=setTimeout(function(){
    var hits=allVideos.filter(function(v){return(v.title||'').toLowerCase().includes(q)||(v.category||'').toLowerCase().includes(q);});
    render(hits);
  },200);
});

loadAll();

(function(){var cv=document.getElementById('bgCanvas');var ctx=cv.getContext('2d');var W,H,time=0;var particles=[];function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}window.addEventListener('resize',resize);resize();for(var i=0;i<50;i++)particles.push({x:Math.random(),y:Math.random(),z:Math.random()*900+100,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.6+.4,pulse:Math.random()*Math.PI*2});var orbs=[{x:.2,y:.3,r:260,s:.00025,ph:0,c:'200,0,0'},{x:.8,y:.7,r:220,s:.0003,ph:2,c:'120,0,0'}];function loop(){time++;ctx.fillStyle='#060608';ctx.fillRect(0,0,W,H);orbs.forEach(function(o){var ox=(o.x+Math.sin(time*o.s+o.ph)*.09)*W,oy=(o.y+Math.cos(time*o.s*.7+o.ph)*.07)*H;var g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);g.addColorStop(0,'rgba('+o.c+',0.07)');g.addColorStop(1,'rgba('+o.c+',0)');ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();});var fov=500,cx=W/2,cy=H/2;particles.forEach(function(p){p.pulse+=.018;p.x+=p.vx/W;p.y+=p.vy/H;if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;var sc=fov/(fov+p.z);var px=cx+(p.x*W-cx)*sc,py=cy+(p.y*H-cy)*sc;var alpha=sc*(.4+.3*Math.sin(p.pulse));ctx.beginPath();ctx.arc(px,py,Math.max(.3,p.r*sc),0,Math.PI*2);ctx.fillStyle='rgba(255,60,60,'+Math.min(alpha,.65)+')';ctx.fill();});requestAnimationFrame(loop);}loop();})();
</script>
</body>
</html>
