<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirim Notifikasi — Naraverse Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#e60000;--red-dim:#991100;--red-glow:rgba(230,0,0,0.18);--dark:#060608;--surface2:#181820;--border:rgba(255,255,255,0.06);--border-red:rgba(230,0,0,0.22);--text:#e8e8ee;--muted:#55556a;--accent:#ff3333;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;}
.wrap{width:100%;max-width:460px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px;color:#fff;text-decoration:none;display:block;margin-bottom:6px;}
.logo span{color:var(--red);}
.subtitle{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:1px;margin-bottom:24px;}
.card{background:#0e0e12;border:1px solid var(--border-red);border-radius:14px;padding:24px;}
.card h2{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.field input,.field textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:.2s;resize:none;}
.field input{height:44px;}
.field textarea{height:80px;}
.field input:focus,.field textarea:focus{border-color:var(--red-dim);box-shadow:0 0 0 3px var(--red-glow);}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);}
.btn{width:100%;height:46px;background:var(--red);border:none;border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px;}
.btn:hover{background:var(--accent);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.result{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:13px;font-family:'DM Mono',monospace;display:none;}
.result.ok{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);color:#4ade80;}
.result.fail{background:rgba(230,0,0,0.08);border:1px solid var(--border-red);color:#ff4466;}
.divider{height:1px;background:var(--border);margin:20px 0;}
.preview{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;}
.preview-title{font-size:12px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:1px;margin-bottom:10px;}
.preview-notif{display:flex;align-items:center;gap:10px;background:#1a1a1a;border-radius:8px;padding:10px 12px;}
.preview-icon{width:32px;height:32px;border-radius:6px;background:#0e0e12;flex-shrink:0;overflow:hidden;}
.preview-icon img{width:100%;height:100%;object-fit:cover;}
.preview-body{flex:1;min-width:0;}
.preview-notif-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px;}
.preview-notif-body{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="logo">NARA<span>VERSE</span></a>
  <div class="subtitle">ADMIN — KIRIM NOTIFIKASI</div>

  <div class="card">
    <h2>BROADCAST NOTIFIKASI</h2>

    <div class="field">
      <label>ADMIN SECRET</label>
      <input type="password" id="secret" placeholder="Secret key kamu">
    </div>
    <div class="divider"></div>
    <div class="field">
      <label>JUDUL NOTIFIKASI</label>
      <input type="text" id="title" placeholder="🎬 Naraverse — Konten Baru!" oninput="updatePreview()">
    </div>
    <div class="field">
      <label>PESAN</label>
      <textarea id="message" placeholder="Ada konten baru yang menanti kamu!" oninput="updatePreview()"></textarea>
    </div>
    <div class="field">
      <label>URL TUJUAN (opsional)</label>
      <input type="url" id="url" placeholder="https://narauniverse.pages.dev/" >
    </div>

    <div class="preview">
      <div class="preview-title">PREVIEW</div>
      <div class="preview-notif">
        <div class="preview-icon"><img src="/image-1.png" alt=""></div>
        <div class="preview-body">
          <div class="preview-notif-title" id="prevTitle">🎬 Naraverse — Konten Baru!</div>
          <div class="preview-notif-body" id="prevBody">Ada konten baru yang menanti kamu!</div>
        </div>
      </div>
    </div>

    <button class="btn" id="sendBtn" onclick="sendNotif()" style="margin-top:16px;">Kirim ke Semua Subscriber</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
var WORKER='https://naraverse.slibawblewer.workers.dev';

function updatePreview(){
  var t=document.getElementById('title').value;
  var m=document.getElementById('message').value;
  document.getElementById('prevTitle').textContent=t||'🎬 Naraverse — Konten Baru!';
  document.getElementById('prevBody').textContent=m||'Ada konten baru yang menanti kamu!';
}

async function sendNotif(){
  var secret=document.getElementById('secret').value.trim();
  var title=document.getElementById('title').value.trim();
  var message=document.getElementById('message').value.trim();
  var url=document.getElementById('url').value.trim();
  if(!secret){showResult('Secret wajib diisi!','fail');return;}
  if(!message){showResult('Pesan wajib diisi!','fail');return;}

  var btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.textContent='Mengirim...';

  try{
    var res=await fetch(WORKER+'/api/push/send',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({secret,title,message,url:url||'/'})
    });
    var d=await res.json();
    if(res.ok){
      showResult('✓ Berhasil dikirim ke '+d.sent+' subscriber'+(d.failed?' ('+d.failed+' gagal)':'')+'!','ok');
    } else {
      showResult('✗ '+( d.error||'Gagal mengirim'),'fail');
    }
  }catch(e){showResult('✗ Koneksi gagal','fail');}
  btn.disabled=false;btn.textContent='Kirim ke Semua Subscriber';
}

function showResult(msg,type){
  var el=document.getElementById('result');
  el.textContent=msg;
  el.className='result '+type;
  el.style.display='block';
}
</script>
</body>
</html>
